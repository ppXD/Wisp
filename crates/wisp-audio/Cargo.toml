[package]
name = "wisp-audio"
version = "0.0.0"
description = "Audio capture sources and DSP for Wisp"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
wisp-core = { path = "../wisp-core" }
hound = "3"
cpal = { version = "0.15", optional = true }

[features]
# Microphone capture via cpal (pulls a platform audio backend; Linux needs libasound2-dev).
mic = ["dep:cpal"]

[dev-dependencies]
tempfile = "3"
wisp-core = { path = "../wisp-core", features = ["testing"] }

[lints]
workspace = true
