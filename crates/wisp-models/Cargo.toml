[package]
name = "wisp-models"
version = "0.0.0"
description = "Model catalog, download, verification, and on-disk storage for Wisp"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["http"]
# Provides HttpDownloader (network model downloads via ureq).
http = ["dep:ureq"]

[dependencies]
wisp-core = { path = "../wisp-core" }
sha2 = "0.10"
ureq = { version = "2", optional = true }
# Unzips the Core ML encoder archive (a `.mlmodelc` directory) next to a whisper.cpp model.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
