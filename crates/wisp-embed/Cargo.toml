[package]
name = "wisp-embed"
version = "0.0.0"
description = "Local + cloud text-embedding backends for the Wisp notes library"
edition = "2021"
license = "MIT"

[dependencies]
# The Embedder contract this crate implements.
wisp-library = { path = "../wisp-library" }
wisp-models = { path = "../wisp-models" }
# Runtime-free HTTP client for self-downloading local model files from the HF hub and for the cloud
# embedder's OpenAI-compatible /embeddings calls. `ureq` has no async runtime of its own, so it is
# safe to call from a plain Tauri command thread (unlike reqwest::blocking).
ureq = { version = "2.12", features = ["json"] }
serde_json = "1"
# ONNX Runtime + tokenizer for the generic recipe-driven embedder (`OrtEmbedder`): runs any local
# ONNX model — encoder (CLS/Mean) or decoder (last-token, e.g. Qwen3) — from a downloaded model dir.
# Pinned to the `ort` version the app's sherpa engine also uses so the onnxruntime native lib stays
# shared (no duplicate runtime); model weights are runtime downloads, not bundled. Kept out of the
# root CI build for the same reason as the sherpa engine.
ort = { version = "=2.0.0-rc.9", features = ["ndarray", "download-binaries"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ndarray = "0.16"

[dev-dependencies]
tempfile = "3"
wisp-core = { path = "../wisp-core" }
