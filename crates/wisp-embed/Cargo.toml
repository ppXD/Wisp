[package]
name = "wisp-embed"
version = "0.0.0"
description = "Local + cloud text-embedding backends for the Wisp notes library"
edition = "2021"
license = "MIT"

[dependencies]
# The Embedder contract this crate implements.
wisp-library = { path = "../wisp-library" }
# Local ONNX text embeddings: downloads the model from the HF hub, tokenizes, runs ONNX Runtime, and
# pools — all behind one call. Pulls onnxruntime via `ort`; the app shares sherpa's runtime (handled
# at app-integration). Kept out of the root CI build for the same reason as the sherpa engine.
fastembed = "4"
# Runtime-free HTTP client for the cloud embedder's OpenAI-compatible /embeddings calls. `ureq` has
# no async runtime of its own, so it is safe to call from a plain Tauri command thread (unlike
# reqwest::blocking). Already in the tree via hf-hub, so it adds no new build cost.
ureq = { version = "2.12", features = ["json"] }
serde_json = "1"
