[package]
name = "wisp-engine-sherpa"
version = "0.0.0"
description = "sherpa-onnx ASR engine for Wisp"
edition = "2021"
license = "MIT"

[dependencies]
wisp-core = { path = "../wisp-core" }
wisp-pipeline = { path = "../wisp-pipeline" }
sherpa-rs = { version = "0.6", default-features = false, features = ["download-binaries"] }
# Direct access to the sys layer for the online (streaming) recognizer API, which sherpa-rs only
# wraps for offline use. Feature-matched to sherpa-rs's own dep so cargo unifies to one sys build.
sherpa-rs-sys = { version = "0.6.8", default-features = false, features = ["download-binaries"] }
# Physical-core detection for the ASR thread count (pure Rust; no native lib linked).
num_cpus = "1"

[features]
# Build the DirectML-enabled onnxruntime so the sherpa engines can run on any Windows DX12 GPU
# (one binary, runtime EP selection + CPU fallback). Off by default → the CPU build is unchanged;
# enable on a Windows GPU build. Forwards to both sherpa deps so cargo unifies one sys build.
directml = ["sherpa-rs/directml", "sherpa-rs-sys/directml"]

[dev-dependencies]
hound = "3.5"
