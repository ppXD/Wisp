# Smoke-builds the whisper.cpp engine crate with the Vulkan GPU backend on Windows.
#
# Unlike the sherpa-onnx DirectML path (which compiles onnxruntime from source for hours and has no
# upstream prebuilt), whisper.cpp + Vulkan builds in minutes and covers any Vulkan GPU — AMD, Intel,
# or NVIDIA — with ggml's built-in CPU fallback. This validates that the from-source Vulkan build
# links cleanly so we can wire it into the Windows app. Runs on demand.
name: Windows Vulkan whisper smoke

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-vulkan.yml"
      - "app/src-tauri/build.rs"
      - "app/src-tauri/Cargo.toml"
      - "app/src-tauri/build_support/**"
      - "app/src-tauri/msvc-runtime-required.txt"
      - "app/src-tauri/tauri*.json"
      - "crates/wisp-engine-whisper-cpp/**"
      - "scripts/smoke-windows-installer.ps1"
      - "scripts/stage-vulkan-loader.sh"
      - "scripts/verify-windows-runtime.sh"
      - "scripts/verify-windows-runtime-config.mjs"

env:
  CARGO_TERM_COLOR: always
  # Keep the build tree shallow: ggml-vulkan's vulkan-shaders-gen sub-build nests deeply, and from the
  # default target dir its .pdb path runs past Windows' 260-char MAX_PATH ("cannot open program
  # database"). A short target root keeps every nested path well under the limit.
  CARGO_TARGET_DIR: 'D:\b'

jobs:
  build:
    name: whisper.cpp + Vulkan (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # the vendored whisper.cpp is a submodule
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Put cl.exe + the MSVC include/lib env on PATH so the Ninja generator (and ggml-vulkan's
      # vulkan-shaders-gen sub-build) can find the compiler. Ninja itself is preinstalled.
      - name: Set up the MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install the Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Stage the official Vulkan loader
        shell: bash
        run: ./scripts/stage-vulkan-loader.sh app/src-tauri/windows-runtime
      - name: Install the frontend deps
        working-directory: app
        run: npm ci
      - name: Verify Windows runtime config
        run: node scripts/verify-windows-runtime-config.mjs
      # `tauri build` runs the frontend build (beforeBuildCommand) + the cargo release build + the NSIS
      # bundler in one step, producing the real Windows GPU installer: default features (sherpa on CPU)
      # plus whisper-vulkan (whisper on the GPU, CPU fallback). This also proves the exact release
      # recipe — that tauri's bundler honours CARGO_TARGET_DIR=D:\b — before wiring it into release.yml.
      - name: Build the Windows GPU installer (whisper.cpp Vulkan)
        working-directory: app
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"
          npm run tauri build -- --features whisper-vulkan --config src-tauri/tauri.vulkan.conf.json
      # Show where the NSIS bundler dropped the installer so the release.yml recipe can target the same
      # path (confirms CARGO_TARGET_DIR is honoured by the bundler, not just the compiler).
      - name: Locate the installer (diagnostic)
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "D:\b","app\src-tauri\target" -Include *-setup.exe -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -Auto
      - name: Verify the installer runtime
        shell: bash
        run: ./scripts/verify-windows-runtime.sh D:/b/release/bundle/nsis/Wisp_*-setup.exe --require-vulkan
      - name: Smoke-test the packaged frontend and close behavior
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'D:\b\release\bundle\nsis\Wisp_*-setup.exe' | Select-Object -First 1
          ./scripts/smoke-windows-installer.ps1 -Installer $installer.FullName
      # Upload the installer so it can be downloaded and tested on real Windows hardware (GPU + non-GPU).
      - name: Upload the Windows GPU installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wisp-windows-gpu-installer
          if-no-files-found: error
          # tauri honours CARGO_TARGET_DIR, so the NSIS bundle lands under D:\b (confirmed by the
          # locate step). A single absolute path keeps upload-artifact's root unambiguous.
          path: D:\b\release\bundle\nsis\*-setup.exe
      # Always list what the CMake build actually produced, so a link-path/lib-name mismatch in
      # build.rs is visible from the log even when the build fails at the link step.
      - name: List the produced whisper/ggml libs (diagnostic)
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "$env:CARGO_TARGET_DIR" -Include *.lib,*.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '(?i)whisper|ggml|vulkan' } |
            Select-Object FullName, Length | Sort-Object FullName | Format-Table -Auto
