# Builds the Apple-Silicon (arm64) macOS app. Intel is intentionally unsupported: the screencapture
# stack (apple-metal) needs the macOS 15 SDK, which no GitHub Intel runner can provide, and the
# WebRTC AEC won't cross-compile from an Apple-Silicon host — so a working x86_64 slice isn't
# buildable. Apple Silicon is the only supported target. Manual (workflow_dispatch) or on a v* tag.
name: Release (Apple Silicon)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # whisper.cpp is vendored as a submodule
      # apple-metal (via screencapture) needs the macOS 15 SDK; the runner's default Xcode is older.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The WebRTC AEC crate's `bundled` build compiles vendored WebRTC with meson + ninja, which
      # aren't on the runner by default.
      - name: Install meson + ninja
        run: brew install meson ninja
      - name: Install frontend deps
        working-directory: app
        run: npm ci
      - name: Build the app
        working-directory: app
        run: npm run tauri build -- --bundles app
      - name: Verify the binary is arm64
        working-directory: app/src-tauri/target/release/bundle/macos
        run: lipo -info Wisp.app/Contents/MacOS/app
      - name: Zip the .app
        working-directory: app/src-tauri/target/release/bundle/macos
        run: ditto -c -k --sequesterRsrc --keepParent Wisp.app "$GITHUB_WORKSPACE/Wisp-arm64.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: wisp-apple-silicon
          path: Wisp-arm64.app.zip
