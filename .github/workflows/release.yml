# Builds installers and publishes them as a DRAFT GitHub Release so you review the artifacts before
# hitting "Publish". Produces:
#
#   macOS:   Wisp_<ver>_aarch64.dmg   (Apple Silicon only)
#   Windows: Wisp_<ver>_x64-setup.exe (NSIS, smaller) + Wisp_<ver>_x64_en-US.msi
#   Linux:   Wisp_<ver>_amd64.deb + Wisp_<ver>_amd64.AppImage
#
# Intel macOS is intentionally unsupported (Metal/screencapture need the macOS 15 SDK no Intel runner
# provides; WebRTC AEC won't cross-compile from Apple Silicon). The Windows and Linux builds are the
# universal GPU installers (whisper.cpp on Vulkan, with ggml's CPU fallback when there's no Vulkan
# device; sherpa stays CPU).
#
# Trigger: push a `v*` tag (e.g. `git tag v0.2.0 && git push --tags`), or run manually with a tag.
#
# # Size / performance
#
# The shipped binary uses the workspace release profile (fat LTO + codegen-units=1 + strip) — smallest
# + fastest. The bulk of the installer is the ML runtime (onnxruntime + sherpa-onnx + whisper-metal +
# WebRTC), which is inherent and not shrinkable; ASR models download on first use, never bundled.
#
# # macOS signing & notarization (optional)
#
# All APPLE_* secrets are optional. Set them to ship a Gatekeeper-clean signed + notarized .dmg.
# Without them the .dmg is unsigned and users run `xattr -cr /Applications/Wisp.app` once. Secrets:
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD  base64 .p12 + its password
#   APPLE_SIGNING_IDENTITY                          "Developer ID Application: Name (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID       Apple ID, app-specific password, team id
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0) — must already exist on the repo"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write # tauri-action creates the draft Release and uploads the installers

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # No --target: macos-15 is arm64, and tauri.conf.json's frameworks path is target/release
          # (not target/<triple>/release), so a host build keeps the dylibs where the bundle looks.
          - os: macos-15
            label: macOS arm64
            args: ""
          # The single Windows installer is the universal GPU build: whisper.cpp on the Vulkan GPU,
          # with whisper.cpp's automatic CPU fallback when there's no Vulkan device. sherpa stays CPU.
          - os: windows-latest
            label: Windows x64
            args: "--features whisper-vulkan --config src-tauri/tauri.vulkan.conf.json"
          # Same universal GPU build on Linux (Vulkan whisper.cpp + PulseAudio monitor system audio +
          # WebRTC AEC). 22.04 keeps the glibc floor usable on the oldest supported Ubuntu LTS; the
          # Vulkan loader is bundled into the artifacts like the Windows installer's vulkan-1.dll.
          - os: ubuntu-22.04
            label: Linux x64
            args: "--features whisper-vulkan"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # whisper.cpp is vendored as a submodule

      # Metal (via screencapture) needs the macOS 15 SDK; the runner's default Xcode is older.
      - name: Select latest Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable

      # No rust-cache: sherpa-rs-sys downloads its prebuilt libs to a dir outside target/ (and on
      # Windows bakes absolute link paths), so a cache hit restores target/ without the libs it points
      # at — the app build.rs DLL staging then fails on a missing onnxruntime.dll. Releases are
      # infrequent, so build clean (matches the CI app-build jobs, which omit the cache for the same reason).
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The WebRTC AEC crate's bundled build compiles vendored WebRTC with meson + ninja.
      - name: Install meson + ninja
        if: runner.os == 'macOS'
        run: brew install meson ninja

      # Linux system deps: Tauri's webkit/gtk stack, ALSA for cpal mic capture, libpulse for the
      # monitor system-audio source, meson+ninja for the WebRTC AEC build, and the Vulkan SDK for
      # the whisper.cpp Vulkan backend. glslc is not packaged on Ubuntu 22.04, so the Vulkan pieces
      # come from LunarG's official jammy repo. At package time `app/src-tauri/build.rs` bundles the
      # loader (`libvulkan.so.1`) into the artifacts — the same approach as `vulkan-1.dll` on Windows —
      # and the deb also declares `libvulkan1` as a dependency.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file gnupg ca-certificates \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libasound2-dev libpulse-dev meson ninja-build libclang-dev \
            libayatana-appindicator3-dev
          wget -qO /tmp/lunarg.asc https://packages.lunarg.com/lunarg-signing-key-pub.asc
          wget -qO /tmp/lunarg.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo install -m644 /tmp/lunarg.asc /etc/apt/trusted.gpg.d/lunarg.asc
          sudo install -m644 /tmp/lunarg.list /etc/apt/sources.list.d/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      # Windows ships the universal GPU installer (whisper.cpp + Vulkan). ggml-vulkan's vulkan-shaders-gen
      # sub-build nests deeply and overruns Windows' 260-char MAX_PATH from the default target dir, so
      # shorten it; the Ninja generator needs cl.exe on PATH; and the SDK provides the headers +
      # vulkan-1.lib. (macOS GPU is Metal, already in the default build.)
      - name: Shorten the Windows build tree (MAX_PATH)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_DIR=D:\\b" >> "$GITHUB_ENV"
      - name: Set up the MSVC build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install the Vulkan SDK
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      # The SDK supplies headers + the import library, but not the redistributable loader DLL. Stage
      # LunarG's official, checksum-pinned x64 runtime so Wisp can launch and use the CPU fallback even
      # on machines whose GPU driver did not install vulkan-1.dll.
      - name: Stage the official Vulkan loader
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/stage-vulkan-loader.sh app/src-tauri/windows-runtime

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Verify macOS entitlement config
        if: runner.os == 'macOS'
        run: |
          test "$(plutil -extract 'com\.apple\.security\.device\.audio-input' raw app/src-tauri/Entitlements.plist)" = "true"
          test "$(plutil -extract 'com\.apple\.security\.cs\.disable-library-validation' raw app/src-tauri/Entitlements.plist)" = "true"

      # Stamp the version from the tag into the manifests so installer FILENAMES and the embedded
      # version (macOS About box, Windows MSI ProductVersion) match the release. The repo's checked-in
      # 0.1.0 stays as the working version; the tag is the source of truth at release time.
      - name: Sync version from tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          echo "Releasing version $VER from tag $TAG"
          node -e "const f='app/src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version='$VER';fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
          node -e "const f='app/package.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version='$VER';fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
          node -e "const f='app/src-tauri/Cargo.toml',fs=require('fs');let s=fs.readFileSync(f,'utf8');s=s.replace(/^version = \"[^\"]*\"/m,'version = \"$VER\"');fs.writeFileSync(f,s)"

      # Build the sherpa engine first so its prebuilt libs land in target/release before the app's
      # build.rs runs: Windows stages the onnxruntime/sherpa DLLs into the bundle resources, and macOS
      # validates tauri.conf.json's frameworks (target/release/*.dylib) at compile time. Cargo doesn't
      # order one build script before a dependent's, so building the engine first removes that race.
      - name: Stage sherpa runtime libs
        run: cargo build --release --manifest-path app/src-tauri/Cargo.toml -p wisp-engine-sherpa

      - name: Build installers + draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The .dmg ships UNSIGNED — users run `xattr -cr /Applications/Wisp.app` once. Passing empty
          # APPLE_* secrets made tauri-action attempt (and fail) a keychain certificate import, so the
          # signing env is omitted entirely. To sign + notarize, set the APPLE_* secrets and restore
          # their env vars here (APPLE_CERTIFICATE / _PASSWORD / SIGNING_IDENTITY, APPLE_ID / _PASSWORD
          # / _TEAM_ID) — see the header.
        with:
          projectPath: app
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Wisp ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify bundled macOS entitlements
        if: runner.os == 'macOS'
        run: ./scripts/verify-macos-entitlements.sh app/src-tauri/target/release/bundle/dmg/Wisp_*.dmg

      - name: Verify bundled Windows runtime
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/verify-windows-runtime.sh D:/b/release/bundle/nsis/Wisp_*-setup.exe --require-vulkan

      - name: Smoke-test the packaged Windows frontend and close behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'D:\b\release\bundle\nsis\Wisp_*-setup.exe' | Select-Object -First 1
          ./scripts/smoke-windows-installer.ps1 -Installer $installer.FullName
