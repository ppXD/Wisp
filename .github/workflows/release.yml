# Builds runnable installers: the Apple-Silicon (arm64) macOS app and the Windows x64 app. Intel
# macOS is intentionally unsupported (the screencapture/apple-metal stack needs the macOS 15 SDK no
# Intel runner provides, and WebRTC AEC won't cross-compile from Apple Silicon). The Windows build
# is mic + sherpa-onnx (system audio / AEC / Metal are macOS-only and degrade). Manual or on a v* tag.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # whisper.cpp is vendored as a submodule
      # apple-metal (via screencapture) needs the macOS 15 SDK; the runner's default Xcode is older.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The WebRTC AEC crate's `bundled` build compiles vendored WebRTC with meson + ninja, which
      # aren't on the runner by default.
      - name: Install meson + ninja
        run: brew install meson ninja
      - name: Install frontend deps
        working-directory: app
        run: npm ci
      - name: Build the app
        working-directory: app
        run: npm run tauri build -- --bundles app
      - name: Verify the binary is arm64
        working-directory: app/src-tauri/target/release/bundle/macos
        run: lipo -info Wisp.app/Contents/MacOS/app
      - name: Zip the .app
        working-directory: app/src-tauri/target/release/bundle/macos
        run: ditto -c -k --sequesterRsrc --keepParent Wisp.app "$GITHUB_WORKSPACE/Wisp-arm64.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: wisp-apple-silicon
          path: Wisp-arm64.app.zip

  windows:
    name: build (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend deps
        working-directory: app
        run: npm ci
      - name: Build the app installers
        working-directory: app
        run: npm run tauri build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: wisp-windows-x64
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
