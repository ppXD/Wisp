name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: test
        run: cargo test --all --all-features

  # Proves the Tauri shell + its cross-platform deps (sherpa-onnx, cpal) build on Windows, plus the
  # WebRTC AEC3 echo canceller (bundled webrtc-audio-processing — meson/ninja + libclang + MSVC). The
  # remaining macOS-only bits (ScreenCaptureKit, Metal whisper.cpp) are absent and degrade.
  #
  # No rust-cache here: sherpa-rs-sys downloads its prebuilt C library to a dir *outside* the cached
  # target/ + ~/.cargo (AppData\Local\sherpa-rs), then bakes that absolute path into the build
  # script's link-search directives. A cache hit restores target/ with those directives but not the
  # download they point at, so link.exe fails with "cannot open input file 'cargs.lib'". Build clean.
  windows-app:
    name: app builds (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # wisp-aec builds the bundled webrtc-audio-processing: meson + ninja drive the C++ build, MSVC
      # is the compiler (msvc-dev-cmd puts cl.exe on PATH so meson finds it), and bindgen needs
      # libclang from the runner's preinstalled LLVM. Same AEC3 the macOS job builds via brew.
      - name: Set up MSVC (meson needs cl.exe on PATH)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install meson + ninja
        run: pip install --upgrade meson ninja
      - name: Point bindgen at the runner's LLVM
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Build the frontend (tauri-build needs the dist)
        working-directory: app
        run: |
          npm ci
          npm run build
      # Build the sherpa engine first so sherpa-rs-sys drops the onnxruntime / sherpa DLLs into the
      # target dir before the app's build.rs stages them for tauri's `resources` check. Cargo doesn't
      # order one build script before a dependent's, so a single `cargo build` can run the app's
      # build.rs first and fail on the not-yet-present DLLs; a separate prior step removes that race.
      - name: Stage sherpa runtime DLLs
        run: cargo build --manifest-path app/src-tauri/Cargo.toml -p wisp-engine-sherpa
      - name: Build the app
        run: cargo build --manifest-path app/src-tauri/Cargo.toml

  # Proves the macOS app builds — including the macOS-ONLY code no other CI job ever compiles:
  # ScreenCaptureKit system audio, the WebRTC AEC3 echo canceller, Metal whisper.cpp, and Apple
  # SpeechAnalyzer. Without this job a macOS-only regression slips past CI and only surfaces on a real
  # Mac build/release. Same sherpa-rs-sys download-path caveat as the Windows job, so no rust-cache.
  macos-app:
    name: app builds (macos)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # whisper.cpp is vendored as a submodule
      # Metal (via screencapture) needs the macOS 15 SDK; the runner's default Xcode is older.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The WebRTC AEC crate's bundled build compiles vendored WebRTC with meson + ninja.
      - name: Install meson + ninja
        run: brew install meson ninja
      - name: Build the frontend (tauri-build needs the dist)
        working-directory: app
        run: |
          npm ci
          npm run build
      # Build sherpa in RELEASE so its prebuilt dylibs land in target/release — the exact path
      # tauri.conf.json's `bundle.macOS.frameworks` points at, which tauri_build validates at compile
      # time. The app itself still builds in debug (fast); only the dylib *location* needs release.
      - name: Stage sherpa runtime libs
        run: cargo build --release --manifest-path app/src-tauri/Cargo.toml -p wisp-engine-sherpa
      - name: Build the app
        run: cargo build --manifest-path app/src-tauri/Cargo.toml
