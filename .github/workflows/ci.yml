name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: test
        run: cargo test --all --all-features

  # Proves the Tauri shell + its cross-platform deps (sherpa-onnx, cpal) build on Windows, where the
  # macOS-only bits (ScreenCaptureKit, WebRTC AEC, Metal whisper.cpp) are absent and degrade.
  #
  # No rust-cache here: sherpa-rs-sys downloads its prebuilt C library to a dir *outside* the cached
  # target/ + ~/.cargo (AppData\Local\sherpa-rs), then bakes that absolute path into the build
  # script's link-search directives. A cache hit restores target/ with those directives but not the
  # download they point at, so link.exe fails with "cannot open input file 'cargs.lib'". Build clean.
  windows-app:
    name: app builds (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the frontend (tauri-build needs the dist)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Build the app
        run: cargo build --manifest-path app/src-tauri/Cargo.toml
