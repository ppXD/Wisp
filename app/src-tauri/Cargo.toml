[package]
name = "app"
version = "0.1.0"
description = "Wisp — local real-time meeting transcription"
authors = ["Mars.P <marsxxd@outlook.com>"]
edition = "2021"

# Standalone workspace so this Tauri app is not built by the root library workspace/CI.
[workspace]

# As its own workspace this crate does not inherit the root release profile, so set it here:
# strip the symbol table and thin-LTO the shipped binary to keep the packaged .app lean.
[profile.release]
strip = true
lto = "thin"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

wisp-core = { path = "../../crates/wisp-core" }
wisp-audio = { path = "../../crates/wisp-audio", features = ["mic", "file"] }
wisp-models = { path = "../../crates/wisp-models" }
wisp-pipeline = { path = "../../crates/wisp-pipeline" }
# sherpa-onnx engines (SenseVoice, Whisper-ONNX, diarization, denoise) — cross-platform.
wisp-engine-sherpa = { path = "../../crates/wisp-engine-sherpa" }
# Opt-in cloud transcription engine (HTTP) — cross-platform.
wisp-engine-cloud = { path = "../../crates/wisp-engine-cloud" }

# macOS-only native deps. System-audio capture (ScreenCaptureKit), WebRTC AEC (needs meson), the
# Metal Whisper engine, and the AVFoundation/sysctl helpers all live here; other platforms degrade
# to mic-only + the cross-platform sherpa engines until their own impls are added.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Reading total physical memory (sysctl hw.memsize) to recommend a machine-appropriate model.
libc = "0.2"
wisp-screencapture = { path = "../../crates/wisp-screencapture" }
wisp-aec = { path = "../../crates/wisp-aec" }
# GPU (Metal) Whisper engine.
wisp-engine-whisper-cpp = { path = "../../crates/wisp-engine-whisper-cpp" }

# Windows-only native deps. System-audio capture via WASAPI loopback — the counterpart to macOS
# ScreenCaptureKit, so Windows gets the same one-click "capture the meeting" Live experience.
[target.'cfg(target_os = "windows")'.dependencies]
wisp-loopback = { path = "../../crates/wisp-loopback" }
