[package]
name = "app"
version = "0.1.0"
description = "Wisp — local real-time meeting transcription"
authors = ["Mars.P <marsxxd@outlook.com>"]
edition = "2021"

# Standalone workspace so this Tauri app is not built by the root library workspace/CI.
[workspace]

# As its own workspace this crate does not inherit the root release profile, so set it here. These
# trade a slower release compile (fine — releases are infrequent) for the smallest, fastest shipped
# binary: strip removes the symbol table (big size win, zero perf cost), fat LTO optimizes across the
# whole program (smaller + faster than thin), and one codegen unit lets the optimizer see everything.
# (panic = "abort" is deliberately NOT set: it would turn a caught Tauri-command panic into a crash.)
# The ML runtime dylibs (onnxruntime/sherpa/whisper) dominate bundle size regardless.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Name the binary "Wisp" so the process / macOS Dock name reads "Wisp" (not the crate
# name "app") — in `tauri dev` and bundled alike. (`mainBinaryName` only renames on build.)
[[bin]]
name = "Wisp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Global push-to-talk hotkey for dictation (fires on key press AND release).
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

wisp-core = { path = "../../crates/wisp-core" }
# Insert dictated text into the frontmost app (clipboard + synthesized ⌘V). Stub off macOS.
wisp-textinject = { path = "../../crates/wisp-textinject" }
wisp-audio = { path = "../../crates/wisp-audio", features = ["mic", "file"] }
wisp-models = { path = "../../crates/wisp-models" }
wisp-pipeline = { path = "../../crates/wisp-pipeline" }
# Opt-in cloud transcription engine (HTTP) — cross-platform.
wisp-engine-cloud = { path = "../../crates/wisp-engine-cloud" }

# The sherpa-onnx ASR engines run on every platform, but the backend differs: macOS/Linux download
# the prebuilt CPU binaries (fast), while Windows builds sherpa-onnx from source with DirectML for GPU
# (see the windows section). download-binaries and directml are mutually exclusive in sherpa-rs-sys,
# so each platform selects exactly one — default-features = false drops the crate's download default.
[target.'cfg(not(target_os = "windows"))'.dependencies]
wisp-engine-sherpa = { path = "../../crates/wisp-engine-sherpa", default-features = false, features = ["download-binaries"] }

# macOS-only native deps. System-audio capture (ScreenCaptureKit), WebRTC AEC (needs meson), the
# Metal Whisper engine, and the AVFoundation/sysctl helpers all live here; other platforms degrade
# to mic-only + the cross-platform sherpa engines until their own impls are added.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Reading total physical memory (sysctl hw.memsize) to recommend a machine-appropriate model.
libc = "0.2"
wisp-screencapture = { path = "../../crates/wisp-screencapture" }
wisp-aec = { path = "../../crates/wisp-aec" }
# GPU (Metal) Whisper engine.
wisp-engine-whisper-cpp = { path = "../../crates/wisp-engine-whisper-cpp" }
# On-device streaming speech via macOS 26 SpeechAnalyzer (zero download).
wisp-applespeech = { path = "../../crates/wisp-applespeech" }

# Windows-only native deps. System-audio capture via WASAPI loopback — the counterpart to macOS
# ScreenCaptureKit, so Windows gets the same one-click "capture the meeting" Live experience.
[target.'cfg(target_os = "windows")'.dependencies]
wisp-loopback = { path = "../../crates/wisp-loopback" }
# Total physical memory (GlobalMemoryStatusEx) to recommend a machine-appropriate model. Same
# `windows` major as wisp-loopback, so no extra version in the tree.
windows = { version = "0.61", features = ["Win32_System_SystemInformation"] }
# Build sherpa-onnx from source with DirectML so the app auto-uses any DX12 GPU when present and
# degrades to CPU otherwise (runtime EP selection — see wisp-engine-sherpa's execution_provider +
# with_cpu_fallback). One binary, no per-machine build; GPU-less machines are unaffected. macOS gets
# GPU via Metal instead. default-features = false: directml can't coexist with download-binaries.
wisp-engine-sherpa = { path = "../../crates/wisp-engine-sherpa", default-features = false, features = ["directml"] }
