[workspace]
resolver = "2"
members = ["crates/*"]
# Kept out of the library CI build: the Tauri app, and the per-OS native crates (heavy vendored
# libs built at compile time — sherpa/onnxruntime, whisper.cpp/Metal — or OS frameworks:
# ScreenCaptureKit, WebRTC AEC3, WASAPI loopback). The Windows one is covered by the app build on
# the Windows CI runner; the macOS ones by running the app on a Mac.
exclude = [
    "app/src-tauri",
    "crates/wisp-engine-sherpa",
    "crates/wisp-engine-whisper-cpp",
    "crates/wisp-screencapture",
    "crates/wisp-loopback",
    "crates/wisp-aec",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Mars.P <marsxxd@outlook.com>"]
repository = "https://github.com/ppXD/Wisp"

[workspace.dependencies]
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
lto = "fat"
strip = true
codegen-units = 1
