[workspace]
resolver = "2"
members = ["crates/*"]
# Kept out of the library CI build: the Tauri app, and the sherpa engine (heavy native
# onnxruntime download at build time, verified by running the app on macOS).
exclude = ["app/src-tauri", "crates/wisp-engine-sherpa"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Mars.P <marsxxd@outlook.com>"]
repository = "https://github.com/ppXD/Wisp"

[workspace.dependencies]
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
lto = "thin"
strip = true
