[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Mars.P <marsxxd@outlook.com>"]
repository = "https://github.com/ppXD/Wisp"

[workspace.dependencies]
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
lto = "thin"
strip = true
